name: Release

# Publishes to PyPI when a version tag is pushed. Uses PyPI trusted publishing (OIDC): no API token is stored here.
# One-time setup on pypi.org: add a pending publisher for project `ctxrelay`, owner JyotBuch, repo ctxrelay,
# workflow `release.yml`, environment `pypi`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # manual run builds and checks only; publishing needs a tag

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import ctxrelay; print(ctxrelay.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
