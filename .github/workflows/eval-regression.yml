name: Eval regression

# Re-measures graph accuracy on the pinned benchmark repos and fails if it drops below eval/thresholds.json.
# Runs on changes that can move the numbers, weekly (catches tool drift), and on demand.
on:
  pull_request:
    paths:
      - "ctxrelay/graph.py"
      - "eval/**"
      - ".github/workflows/eval-regression.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  graph-accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e . jedi
      - run: npm install --prefix eval typescript@5.6.3
      - name: Fetch benchmark repos at their pinned commits
        run: eval/fetch.sh
      - name: Measure
        env:
          TS_NODE_PATH: ${{ github.workspace }}/eval/node_modules
        run: |
          python eval/graph_eval.py pytest --n 60
          python eval/graph_eval.py nest --n 60
      - name: Check against thresholds
        run: python eval/check_thresholds.py pytest nest | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-eval-results
          path: eval/results/graph_*.json
