name: Bug report
description: Something in ctxrelay misbehaves
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: ctxrelay version, OS, Python version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and what you expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ctxrelay doctor`
      render: text
